[package]
name = "auction-guaranteed"
version = "1.0.0"
edition = "2018"

[lib]
crate-type = ["cdylib"]
name = "auction_guaranteed"  # Explicit library name

[dependencies]
cosmwasm-std = "3.0.9"
serde = { version = "1", features = ["derive"] }
cw-storage-plus = "2.0"
cosmwasm-schema = "2.3"
schemars = "0.8"
thiserror = "2.0"

[dev-dependencies]
proptest = "1.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
